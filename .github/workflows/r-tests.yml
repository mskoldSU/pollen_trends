name: R regression tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tidyverse
            any::readxl
            any::writexl
            any::lubridate
            any::assertthat
          working-directory: .
      - name: Test Excel import
        run: Rscript tests/test-read-sheet.R
      - name: Test seasonal summaries
        run: Rscript tests/test-season-summaries.R
